name: README

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/readme.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render GitHub-Flavored Markdown
        run: |
          set -eu
          npm exec --yes --package=marked@18.0.9 -- marked --gfm README.md > "${RUNNER_TEMP}/readme.html"
          test -s "${RUNNER_TEMP}/readme.html"

      - name: Validate README links
        run: |
          set -eu
          # mailto: is not an HTTP target. Private GitHub repos 404 without a
          # repo-scoped token; GITHUB_TOKEN cannot see sibling private repos.
          cat > "${RUNNER_TEMP}/markdown-link-check.json" <<'EOF'
          {
            "ignorePatterns": [
              { "pattern": "^mailto:" },
              { "pattern": "^https://github\\.com/camilojourney/(invoz|pilaster|smart-calendar|elucy|recovery-mac-system|cloud-deployment)/?$" }
            ],
            "retryOn429": true,
            "retryCount": 5,
            "fallbackRetryDelay": "8s",
            "timeout": "20s",
            "aliveStatusCodes": [200, 206, 999]
          }
          EOF
          npm exec --yes --package=markdown-link-check@3.15.0 -- \
            markdown-link-check --verbose --config "${RUNNER_TEMP}/markdown-link-check.json" README.md
