name: README

on:
  pull_request:
    paths:
      - README.md
      - .github/workflows/readme.yml
      - .node-version
      - package.json
      - package-lock.json
      - evaluation/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked evaluator dependencies
        run: npm ci --ignore-scripts

      - name: Run hermetic evaluator regression tests
        run: npm test

      - name: Evaluate baseline against candidate
        id: evaluate
        run: |
          npm run evaluate -- \
            --baseline "${{ github.event.pull_request.base.sha }}" \
            --candidate "${{ github.sha }}" \
            --network live \
            --out "${RUNNER_TEMP}/readme-evaluation"

      - name: Upload normalized evaluation evidence
        if: always() && steps.evaluate.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readme-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-evaluation
          if-no-files-found: error
